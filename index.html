<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hold Counter — Press Timer Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Archivo+Expanded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16130e;
    --panel: #211c15;
    --panel-raised: #2a231a;
    --panel-border: #423825;
    --amber: #ffa227;
    --amber-dim: #7a5620;
    --amber-glow: rgba(255, 162, 39, 0.55);
    --cream: #ece4d3;
    --steel: #7d7565;
    --steel-dim: #4a443a;
    --red: #e2503c;
    --red-dim: #6e2c22;
    --green-off: #3a4536;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(255,162,39,0.07), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--cream);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    width: 100%;
    max-width: 480px;
    padding: 32px 20px 56px;
  }

  .eyebrow {
    text-align: center;
    font-family: 'Archivo Expanded', sans-serif;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--steel);
    margin-bottom: 6px;
  }

  h1 {
    text-align: center;
    font-family: 'Archivo Expanded', sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 6vw, 32px);
    letter-spacing: -0.01em;
    color: var(--cream);
    margin: 0 0 28px;
  }

  .panel {
    background:
      linear-gradient(180deg, var(--panel-raised), var(--panel));
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 30px 60px -25px rgba(0,0,0,0.7),
      0 0 0 6px rgba(0,0,0,0.25);
  }

  .readouts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .readout {
    background: #0f0d09;
    border: 1px solid #362e21;
    border-radius: 8px;
    padding: 14px 14px 12px;
    position: relative;
    overflow: hidden;
  }

  .readout.wide { grid-column: 1 / -1; }

  .readout::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    opacity: 0.5;
  }

  .readout-label {
    font-family: 'Archivo Expanded', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green-off);
    box-shadow: none;
    transition: background 0.15s ease, box-shadow 0.15s ease;
    flex-shrink: 0;
  }

  .dot.live {
    background: var(--red);
    box-shadow: 0 0 8px 2px var(--red);
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .readout-value {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: clamp(26px, 8vw, 34px);
    color: var(--amber);
    text-shadow: 0 0 12px var(--amber-glow);
    letter-spacing: 0.01em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .readout.wide .readout-value {
    font-size: clamp(30px, 9vw, 40px);
  }

  .readout-unit {
    font-size: 13px;
    color: var(--amber-dim);
    margin-left: 4px;
  }

  .btn-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 22px;
  }

  .push {
    width: 148px;
    height: 148px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    position: relative;
    background:
      radial-gradient(circle at 35% 30%, #ff7a3d, #d8402c 55%, #a12c1e 100%);
    box-shadow:
      0 10px 0 #6e1d13,
      0 14px 24px rgba(0,0,0,0.55),
      inset 0 4px 8px rgba(255,255,255,0.25),
      inset 0 -10px 16px rgba(0,0,0,0.35);
    transform: translateY(0);
    transition: transform 0.06s ease, box-shadow 0.06s ease;
    touch-action: none;
    user-select: none;
  }

  .push:focus-visible {
    outline: 3px solid var(--amber);
    outline-offset: 6px;
  }

  .push .ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid var(--amber-dim);
    opacity: 0;
    transition: opacity 0.15s ease, transform 0.15s ease;
    pointer-events: none;
  }

  .push.active {
    transform: translateY(8px);
    box-shadow:
      0 2px 0 #6e1d13,
      0 4px 10px rgba(0,0,0,0.5),
      inset 0 4px 10px rgba(0,0,0,0.4),
      inset 0 -4px 8px rgba(255,255,255,0.08);
  }

  .push.active .ring {
    opacity: 1;
    transform: scale(1.12);
    border-color: var(--amber);
    box-shadow: 0 0 18px 2px var(--amber-glow);
  }

  .push-label {
    margin-top: 18px;
    font-family: 'Archivo Expanded', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--steel);
    text-align: center;
    transition: color 0.15s ease;
  }

  .push-label.active { color: var(--amber); }

  .footnote {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: var(--steel-dim);
    letter-spacing: 0.02em;
  }

  .footnote button {
    background: none;
    border: none;
    color: var(--steel);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 0;
  }

  .footnote button:hover { color: var(--amber); }

  @media (prefers-reduced-motion: reduce) {
    .dot.live { animation: none; }
    .push, .push .ring { transition: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="eyebrow">Console 01 · Manual Input</div>
    <h1>Hold Counter</h1>

    <div class="panel">
      <div class="readouts">
        <div class="readout">
          <div class="readout-label"><span class="dot" id="dot-last"></span>Last Hold</div>
          <div class="readout-value" id="val-last">0.00<span class="readout-unit">s</span></div>
        </div>
        <div class="readout">
          <div class="readout-label"><span class="dot" id="dot-count"></span>Presses</div>
          <div class="readout-value" id="val-count">000</div>
        </div>
        <div class="readout wide">
          <div class="readout-label"><span class="dot" id="dot-total"></span>Cumulative Hold Time (this session)</div>
          <div class="readout-value" id="val-total">0.00<span class="readout-unit">s</span></div>
        </div>
      </div>
    </div>

    <div class="btn-zone">
      <button class="push" id="pushBtn" aria-label="Press and hold to start timing">
        <span class="ring"></span>
      </button>
      <div class="push-label" id="pushLabel">Press &amp; Hold</div>
    </div>

    <div class="footnote">
      All three readouts live in this tab only — <button id="resetBtn" type="button">reset session</button>, or refresh the page to clear them.
    </div>
  </div>

<script>
  (function () {
    const btn = document.getElementById('pushBtn');
    const pushLabel = document.getElementById('pushLabel');
    const valLast = document.getElementById('val-last');
    const valCount = document.getElementById('val-count');
    const valTotal = document.getElementById('val-total');
    const dotLast = document.getElementById('dot-last');
    const dotCount = document.getElementById('dot-count');
    const dotTotal = document.getElementById('dot-total');
    const resetBtn = document.getElementById('resetBtn');

    let pressCount = 0;
    let cumulativeMs = 0;
    let pressStart = null;
    let rafId = null;
    let activePointerId = null;

    function formatSeconds(ms) {
      const s = ms / 1000;
      if (s < 60) return s.toFixed(2) + 's';
      const mins = Math.floor(s / 60);
      const secs = (s - mins * 60).toFixed(2).padStart(5, '0');
      return mins + ':' + secs;
    }

    function renderStatic() {
      valCount.textContent = String(pressCount).padStart(3, '0');
      valTotal.innerHTML = formatSeconds(cumulativeMs);
    }

    function renderLastFinal(durationMs) {
      valLast.innerHTML = formatSeconds(durationMs);
    }

    function tick() {
      if (pressStart === null) return;
      const now = performance.now();
      const held = now - pressStart;
      valLast.innerHTML = formatSeconds(held);
      valTotal.innerHTML = formatSeconds(cumulativeMs + held);
      rafId = requestAnimationFrame(tick);
    }

    function startPress(e) {
      if (pressStart !== null) return;
      if (e.cancelable) e.preventDefault();
      activePointerId = e.pointerId;
      if (btn.setPointerCapture && e.pointerId !== undefined) {
        try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      }
      pressStart = performance.now();
      btn.classList.add('active');
      pushLabel.textContent = 'Holding…';
      pushLabel.classList.add('active');
      dotLast.classList.add('live');
      dotTotal.classList.add('live');
      rafId = requestAnimationFrame(tick);
    }

    function endPress(e) {
      if (pressStart === null) return;
      if (e && e.pointerId !== undefined && activePointerId !== null && e.pointerId !== activePointerId) return;
      const durationMs = performance.now() - pressStart;
      cumulativeMs += durationMs;
      pressCount += 1;
      pressStart = null;
      activePointerId = null;

      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;

      btn.classList.remove('active');
      pushLabel.textContent = 'Press & Hold';
      pushLabel.classList.remove('active');
      dotLast.classList.remove('live');
      dotTotal.classList.remove('live');
      dotCount.classList.add('live');
      setTimeout(() => dotCount.classList.remove('live'), 220);

      renderLastFinal(durationMs);
      renderStatic();
    }

    btn.addEventListener('pointerdown', startPress);
    btn.addEventListener('pointerup', endPress);
    btn.addEventListener('pointercancel', endPress);
    btn.addEventListener('lostpointercapture', endPress);

    // Keyboard support: space/enter act as press-and-hold
    let keyHeld = false;
    btn.addEventListener('keydown', function (e) {
      if ((e.code === 'Space' || e.code === 'Enter') && !keyHeld) {
        keyHeld = true;
        startPress({ preventDefault: () => {}, cancelable: false, pointerId: undefined });
      }
    });
    btn.addEventListener('keyup', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') {
        keyHeld = false;
        endPress({ pointerId: undefined });
      }
    });

    resetBtn.addEventListener('click', function () {
      pressCount = 0;
      cumulativeMs = 0;
      pressStart = null;
      renderStatic();
      valLast.innerHTML = '0.00<span class="readout-unit">s</span>';
    });

    renderStatic();
  })();
</script>
</body>
</html>
